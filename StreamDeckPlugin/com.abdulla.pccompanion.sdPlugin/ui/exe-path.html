<!DOCTYPE html>
<html>
	<head lang="en">
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="PC Companion EXE">
			<sdpi-file setting="exePath" accept=".exe" placeholder="Leave blank to use the installed PC Companion"></sdpi-file>
		</sdpi-item>
		<sdpi-item>
			<sdpi-color disabled></sdpi-color>
		</sdpi-item>
		<details>
			<summary>About</summary>
			<p>
				Leave blank to use the installed app at
				<code>%LOCALAPPDATA%\PC Companion\PCCompanion.exe</code>.
				Only set a path here if you installed PC Companion somewhere else.
			</p>
		</details>
	</body>
</html>
